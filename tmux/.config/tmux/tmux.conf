# ~/.config/tmux/tmux.conf

# --- Prefix: Alt+a instead of Ctrl+b ---
unbind C-b
set -g prefix M-a
bind M-a send-prefix          # press Alt+a twice to send a literal Alt+a

# --- Pane selection with Alt + arrow keys (no prefix needed) ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Mouse mode ---
set -g mouse on

# --- Number windows/panes from 1, renumber on close ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- New panes/windows open in the current pane's directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind \\  split-window -h -c "#{pane_current_path}"   # side-by-side split, no shift
bind -   split-window -v -c "#{pane_current_path}"   # stacked split, no shift
bind c   new-window      -c "#{pane_current_path}"

# --- Shell: use fish inside tmux (login shell is fish; make tmux explicit so it
#     doesn't inherit whatever $SHELL started the server). docker access is safe:
#     the primary group is 'docker', which every shell inherits regardless. ---
set -g default-shell /usr/bin/fish

# --- Quality-of-life ---
set -sg escape-time 10                       # kill Alt/Esc key lag (matters with M-a prefix)
set -g  history-limit 50000                  # deeper scrollback
set -g  focus-events on                      # let editors react to focus changes
set -ga terminal-overrides ",*256col*:Tc"    # true color in capable terminals

# --- Copy to the Wayland system clipboard (wl-clipboard) ---
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y                  send -X copy-pipe-and-cancel "wl-copy"

# --- Pane resizing: prefix + Alt-arrow, repeatable ---
bind -r M-Left  resize-pane -L 5
bind -r M-Right resize-pane -R 5
bind -r M-Up    resize-pane -U 5
bind -r M-Down  resize-pane -D 5

# --- Reload config with prefix + r ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Kill pane/window without the confirmation prompt ---
bind x kill-pane
bind & kill-window

# --- Session picker with prefix + w ---
bind w choose-tree -Zs

# --- New session (prompts for a name) with prefix + N ---
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# --- Highlight the active window name in the status bar ---
setw -g window-status-current-style bold,fg=white,bg=black
setw -g window-status-style fg=black

# --- Window label format: index:name, with a separator between windows ---
setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-separator      "|"
